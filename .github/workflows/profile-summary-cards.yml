name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-summary-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: vn7n24fzkq/github-profile-summary-cards@7022eb6bd48de38b092f54110a8ff8185f2ac4a1 # release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          TIME_ZONE: Asia/Kolkata
          AUTO_PUSH: 'false'
          THEME: tokyonight
      - name: Verify card output
        shell: bash
        run: |
          for card in 1-repos-per-language 2-most-commit-language 3-stats 4-productive-time; do
            test -s "profile-summary-card-output/tokyonight/$card.svg"
            grep -q '<svg' "profile-summary-card-output/tokyonight/$card.svg"
          done
      - name: Publish refreshed assets
        shell: bash
        run: |
          git add profile-summary-card-output/tokyonight/1-repos-per-language.svg profile-summary-card-output/tokyonight/2-most-commit-language.svg profile-summary-card-output/tokyonight/3-stats.svg profile-summary-card-output/tokyonight/4-productive-time.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile summary cards"
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git rebase FETCH_HEAD
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          exit 1
